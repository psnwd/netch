name: Netrix Build CI
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checksum
        shell: pwsh
        run: |
          echo "SOURCE_NETRIX_SHA256=$(.\sha256.ps1 .\Netrix)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_OTHER_SHA256=$(.\sha256.ps1 .\Other)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_REDIRECTOR_SHA256=$(.\sha256.ps1 .\Redirector)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV
          echo "SOURCE_ROUTEHELPER_SHA256=$(.\sha256.ps1 .\RouteHelper)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Cache Netrix
        uses: actions/cache@v4
        with:
          key: Netrix-${{ runner.os }}-Netrix-${{ env.SOURCE_NETRIX_SHA256 }}
          path: |
            .\Netrix\bin

      - name: Cache Other
        uses: actions/cache@v4
        with:
          key: Netrix-${{ runner.os }}-Other-${{ env.SOURCE_OTHER_SHA256 }}
          path: |
            .\Other\release

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: Netrix-${{ runner.os }}-Redirector-${{ env.SOURCE_REDIRECTOR_SHA256 }}
          path: |
            .\Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: Netrix-${{ runner.os }}-RouteHelper-${{ env.SOURCE_ROUTEHELPER_SHA256 }}
          path: |
            .\RouteHelper\bin

      - name: Check Other
        id: check_other
        uses: andstor/file-existence-action@v2
        with:
          files: .\other\release\aiodns.bin

      - name: Setup Go 1.17.1 (tun2socks)
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: '1.17.1'
          cache: false

      - name: Export Go 1.17.1 root
        shell: pwsh
        if: steps.check_other.outputs.files_exists == 'false'
        run: |
          echo "GO117=$(go env GOROOT)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Setup Go 1.18 (v2ray-sn)
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: '1.18.10'
          cache: false

      - name: Export Go 1.18 root
        shell: pwsh
        if: steps.check_other.outputs.files_exists == 'false'
        run: |
          echo "GO118=$(go env GOROOT)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          go-version: stable

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.check_other.outputs.files_exists == 'false'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        if: steps.check_other.outputs.files_exists == 'false'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          # job logs need a login to read; surface failures as public annotations
          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"  # build scripts change the working directory
          try {
            .\build.ps1 -Configuration Release -OutputPath release *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $msg = "build.ps1 exit code $code"
          } catch {
            $code = 1
            $msg = ($_ | Out-String) + $_.ScriptStackTrace
          }
          if ($code -ne 0) {
            $tail = if (Test-Path $log) { (Get-Content $log -Tail 30) -join "`n" } else { "" }
            $text = ($msg + "`n---`n" + $tail) -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            echo "::error title=build failed::$text"
            exit 1
          }

      - name: Test
        shell: pwsh
        run: |
          dotnet test .\Tests\Tests.csproj -p:Platform=x64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
