name: Netrix Build CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # called by release.yml

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless; never cancel a tag (release) build
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # the tests only need the .NET SDK: run them next to the slow native build instead of after it
  test:
    name: Test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'common.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
          path: ~\.nuget\packages

      - name: Test
        run: dotnet test .\Tests\Tests.csproj -p:Platform=x64

  build:
    name: Build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # each cache is keyed by the sources (and build script) that produce it, build output folders excluded
      - name: Cache Netrix
        uses: actions/cache@v4
        with:
          key: netrix-${{ runner.os }}-app-${{ hashFiles('Netrix/**', '!Netrix/bin/**', '!Netrix/obj/**', 'common.props', 'global.json', 'build.ps1') }}
          path: Netrix\bin

      - name: Cache Other (tun2socks, aiodns, pcap2socks, v2ray-sn, wintun)
        id: cache_other
        uses: actions/cache@v4
        with:
          key: netrix-${{ runner.os }}-other-${{ hashFiles('Other/**', '!Other/release/**', '!Other/pcap2socks/crate/target/**') }}
          path: Other\release

      - name: Cache Redirector
        uses: actions/cache@v4
        with:
          key: netrix-${{ runner.os }}-redirector-${{ hashFiles('Redirector/**', '!Redirector/bin/**', '!Redirector/obj/**') }}
          path: Redirector\bin

      - name: Cache RouteHelper
        uses: actions/cache@v4
        with:
          key: netrix-${{ runner.os }}-routehelper-${{ hashFiles('RouteHelper/**', '!RouteHelper/bin/**', '!RouteHelper/obj/**') }}
          path: RouteHelper\bin

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'common.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
          path: ~\.nuget\packages

      # the toolchains below are only needed when Other\release was not restored from the cache
      - name: Setup Go 1.17.1 (tun2socks)
        uses: actions/setup-go@v5
        if: steps.cache_other.outputs.cache-hit != 'true'
        with:
          go-version: '1.17.1'
          cache: false

      - name: Export Go 1.17.1 root
        shell: pwsh
        if: steps.cache_other.outputs.cache-hit != 'true'
        run: |
          echo "GO117=$(go env GOROOT)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Setup Go 1.18 (v2ray-sn)
        uses: actions/setup-go@v5
        if: steps.cache_other.outputs.cache-hit != 'true'
        with:
          go-version: '1.18.10'
          cache: false

      - name: Export Go 1.18 root
        shell: pwsh
        if: steps.cache_other.outputs.cache-hit != 'true'
        run: |
          echo "GO118=$(go env GOROOT)" | Out-File -Append -Encoding UTF8 -FilePath $Env:GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        if: steps.cache_other.outputs.cache-hit != 'true'
        with:
          go-version: stable

      - name: Setup C++
        uses: msys2/setup-msys2@v2
        if: steps.cache_other.outputs.cache-hit != 'true'
        with:
          update: true
          release: true
          install: base-devel git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-libevent mingw-w64-x86_64-pcre2 mingw-w64-x86_64-freetype mingw-w64-x86_64-libpng mingw-w64-x86_64-bzip2 mingw-w64-x86_64-openssl mingw-w64-x86_64-mbedtls mingw-w64-x86_64-libsodium mingw-w64-x86_64-c-ares mingw-w64-x86_64-boost mingw-w64-x86_64-libmariadbclient unzip p7zip autoconf automake libtool

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        if: steps.cache_other.outputs.cache-hit != 'true'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          # job logs need a login to read; surface failures as public annotations
          $log = Join-Path $env:GITHUB_WORKSPACE "build.log"  # build scripts change the working directory
          try {
            .\build.ps1 -Configuration Release -Release *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            $msg = "build.ps1 exit code $code"
          } catch {
            $code = 1
            $msg = ($_ | Out-String) + $_.ScriptStackTrace
          }
          if ($code -ne 0) {
            $tail = if (Test-Path $log) { (Get-Content $log -Tail 30) -join "`n" } else { "" }
            $text = ($msg + "`n---`n" + $tail) -replace "%","%25" -replace "`r","" -replace "`n","%0A"
            echo "::error title=build failed::$text"
            exit 1
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: .build\release
          retention-days: 7
