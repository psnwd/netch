name: Netrix Release CI

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  # same build and tests as every push: one definition, see build.yml
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .build\release

      - name: Package
        shell: pwsh
        run: |
          Push-Location .build
          7z a -mx9 ..\Netrix.7z release
          7z rn ..\Netrix.7z release Netrix
          Pop-Location

      # the secret is the private half of the key in Netrix/Services/UpdateSignature.cs; without it this step fails on purpose
      - name: Sign
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          .\sign.ps1 -File Netrix.7z

      # release notes = this version's section of CHANGELOG.md + the checksum table the in-app updater reads ("Checksums" heading, then the table)
      - name: Release notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\r?\n\[[0-9])"
          $notes = if ($changelog -match $pattern) { $Matches[1].Trim() } else { 'See CHANGELOG.md.' }
          $hash = (Get-FileHash Netrix.7z -Algorithm SHA256).Hash.ToLower()
          @"
          ## Changelog
          $notes

          ## Checksums
          | File | SHA256 |
          | :- | :- |
          | Netrix.7z | $hash |
          "@ | Set-Content release-notes.md -Encoding UTF8

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          body_path: release-notes.md
          files: |
            Netrix.7z
            Netrix.7z.sig
